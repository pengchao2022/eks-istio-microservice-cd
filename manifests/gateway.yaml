apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: istio-system  
spec:
  selector:
    istio: ingressgateway  
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: lab-vs
  namespace: istio-system  
spec:
  hosts:
  - "*"
  gateways:
  - lab-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        # frontend-service 实际建在 istio-lab 命名空间里
        # 这里跨命名空间调用需要写成全称：frontend-service.istio-lab.svc.cluster.local
        host: frontend-service.istio-lab.svc.cluster.local
        port:
          number: 8080