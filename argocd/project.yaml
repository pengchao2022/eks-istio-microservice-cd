apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: istio-microservice
  namespace: argocd
  labels:
    environment: dev
  finalizers:
    - argocd.argoproj.io/resources-finalizer
spec:
  description: "Microservices project with Istio mesh for dev environment"
  
  destinations:
    - namespace: istio-lab
      server: https://kubernetes.default.svc
    - namespace: istio-ingress   # 允许 ArgoCD 管理 istio-ingress 命名空间
      server: https://kubernetes.default.svc

  # 源码仓库地址
  sourceRepos:
    - 'https://github.com/pengchao2022/eks-istio-microservice-cd.git'

  # 允许该项目管理集群级的 Namespace 资源
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

  # 允许部署到指定命名空间内部的应用资源白名单
  namespaceResourceWhitelist:
    - group: 'apps'
      kind: Deployment
    - group: 'apps'
      kind: StatefulSet
    - group: ''
      kind: Service
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: Secret
    - group: 'networking.k8s.io'
      kind: Ingress
    - group: 'networking.istio.io'
      kind: '*'